<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TrackMate - Установка пароля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 400px;">
    <h2 class="mb-3">🔑 Установка мастер-пароля</h2>
    <p>Этот пароль будет использоваться для шифрования всех ваших данных. Запомните его!</p>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post" action="/setup">
        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Пароль" required minlength="8">
        </div>
        <div class="mb-3">
            <input type="password" name="confirm" class="form-control" placeholder="Подтвердите пароль" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Установить</button>
    </form>
</div>
</body>
</html>
